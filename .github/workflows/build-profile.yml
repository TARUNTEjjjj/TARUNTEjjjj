name: Build profile

on:
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/**
      - .github/workflows/build-profile.yml
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to reviewed commits (this job can push); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # the branch tip, not the commit that triggered a queued run

      - name: Draw banner, tech stack and activity cards
        run: python3 scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?color_snake=#0891b2&color_dots=#ebedf0,#ddd6fe,#c4b5fd,#8b5cf6,#6d28d9
            assets/snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#2e1f5e,#4c2f9c,#7c5ce0,#a78bfa

      - name: Commit the new cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Cards are already up to date."
            exit 0
          fi
          git commit -m "Refresh profile cards"
          # Someone may have pushed while this ran: replay the commit on top and try again.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          exit 1
