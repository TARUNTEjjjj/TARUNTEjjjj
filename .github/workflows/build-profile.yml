name: Build profile

on:
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/**
      - .github/workflows/build-profile.yml
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:

# Read-only unless a job asks for more: only the build job below can push.
permissions:
  contents: read

concurrency:
  group: build-profile
  cancel-in-progress: false

jobs:
  # Third-party code runs in its own job with the read-only token, so it can never push.
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to reviewed commits; Dependabot proposes updates.
      - name: Draw contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake-light.svg?color_snake=#0891b2&color_dots=#ebedf0,#ddd6fe,#c4b5fd,#8b5cf6,#6d28d9
            snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#2e1f5e,#4c2f9c,#7c5ce0,#a78bfa

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snake
          path: |
            snake-light.svg
            snake-dark.svg
          if-no-files-found: error
          retention-days: 1

  build:
    needs: snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # runs only this repository's scripts and GitHub's own actions
    steps:
      # Actions are pinned to reviewed commits (this job can push); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # the branch tip, not the commit that triggered a queued run

      # README.md doesn't show the activity card, so it is not fetched or committed;
      # scripts/build.py explains how to bring it back (--activity).
      - name: Draw banner and tech stack cards
        run: python3 scripts/build.py

      - name: Fetch the contribution snake
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snake
          path: ${{ runner.temp }}/snake

      - name: Commit the new cards
        run: |
          # Take only the two snake files from the snake job's artifact, nothing else.
          cp "$RUNNER_TEMP/snake/snake-light.svg" "$RUNNER_TEMP/snake/snake-dark.svg" assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Cards are already up to date."
            exit 0
          fi
          git commit -m "Refresh profile cards"
          # Someone may have pushed while this ran: replay the commit on top and try again.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          exit 1
